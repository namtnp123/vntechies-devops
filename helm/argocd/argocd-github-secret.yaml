# Optional: apply this only for private repos.
# Replace <YOUR_GITHUB_TOKEN> before applying.
#
#   kubectl apply -f argocd-github-secret.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: github-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/namtnp123/vntechies-devops
  username: x-token
  password: <YOUR_GITHUB_TOKEN>
