apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vntechies-k8s-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/namtnp123/vntechies-devops
    targetRevision: main
    path: k8s-manifest
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
