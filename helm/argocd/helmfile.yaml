repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: eks
    url: https://aws.github.io/eks-charts

releases:
  # ── AWS Load Balancer Controller ───────────────────────────────────────────
  # Prerequisites: fill in vpcId in aws-lb-controller-values.yaml and ensure
  # the IAM role exists (IRSA or Pod Identity) before running helmfile sync.
  - name: aws-load-balancer-controller
    namespace: kube-system
    chart: eks/aws-load-balancer-controller
    version: "1.8.1"
    values:
      - aws-lb-controller-values.yaml

  # ── ArgoCD ─────────────────────────────────────────────────────────────────
  # Helmfile only installs ArgoCD here. Everything else (Ingress, Application
  # manifests, etc.) lives in k8s-manifest/ and is managed by ArgoCD itself.
  #
  # Bootstrap (run once after helmfile sync):
  #   kubectl apply -f argocd-app.yaml
  #
  # After that ArgoCD auto-syncs k8s-manifest/ — including argocd-ingress.yaml.
  - name: argocd
    namespace: argocd
    createNamespace: true
    chart: argo/argo-cd
    version: "7.7.0"
    needs:
      - kube-system/aws-load-balancer-controller
    values:
      - argocd-values.yaml
