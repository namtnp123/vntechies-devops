# EC2NodeClass — defines the AWS-specific node configuration for Karpenter.
# Karpenter discovers subnets and security groups by the karpenter.sh/discovery
# tag applied to them in session-03-eks (vpc.tf and karpenter.tf).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # al2023@latest always picks the latest EKS-optimised Amazon Linux 2023 AMI.
  amiSelectorTerms:
    - alias: al2023@latest
  # Must match the IAM role name output from session-03-eks: karpenter_node_role_name.
  role: dev-eks-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: dev-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: dev-eks
  tags:
    managed_by: karpenter
    env: dev
---
# NodePool — defines scheduling constraints and cost controls for Karpenter nodes.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        node.kubernetes.io/purpose: application
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        # Allow both spot and on-demand; Karpenter prefers spot when available.
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        # Broad family selection improves spot availability.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
  # Hard ceiling to avoid runaway scaling costs.
  limits:
    cpu: "8"
    memory: 16Gi
  disruption:
    # Consolidate idle or underutilised nodes automatically.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
